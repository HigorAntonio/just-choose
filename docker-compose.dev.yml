services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
    environment:
      - NPM_CONFIG_CACHE=/tmp/.npm
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm run db-migrate && npm run db-seed && npm run dev"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run start
