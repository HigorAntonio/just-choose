services:
  postgres:
    image: postgres:12
    environment:
      POSTGRES_DB: just_choose
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:6
    volumes:
      - redis-data:/data
  mailhog:
    image: mailhog/mailhog
    ports:
      - '8025:8025'
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3333:3333'
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    depends_on:
      - postgres
      - redis
      - mailhog
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
volumes:
  postgres-data:
  redis-data:
